<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anno 1800 Inselplaner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Anno 1800</span>
        <span class="sidebar-subtitle">Inselplaner</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="inseln">
          <span class="nav-icon">🏝️</span> Inseln
        </button>
        <button class="nav-item" data-view="karte">
          <span class="nav-icon">🗺️</span> Karte
        </button>
        <button class="nav-item" data-view="todos">
          <span class="nav-icon">✅</span> To-Dos
        </button>
        <button class="nav-item" data-view="warenketten">
          <span class="nav-icon">🔗</span> Warenketten
        </button>
      </nav>
      <div class="sidebar-footer">
        <div id="sync-status" class="sync-status"></div>
        <button class="nav-item" data-view="einstellungen">
          <span class="nav-icon">⚙️</span> Einstellungen
        </button>
      </div>
    </aside>

    <main class="content" id="main-content">
      <div id="app-loading" class="app-loading">Lade Daten von GitHub...</div>
      <div id="legacy-migration-banner" class="legacy-migration-banner" hidden>
        Es wurden lokale Daten aus einer früheren Version gefunden, die noch nicht mit GitHub synchronisiert sind.
        Trag in den <button class="link-button" data-view="einstellungen">Einstellungen</button> deinen GitHub-Token ein, um sie zu übernehmen.
      </div>
      <section id="view-inseln" class="view"></section>
      <section id="view-karte" class="view"></section>
      <section id="view-todos" class="view"></section>
      <section id="view-warenketten" class="view"></section>
      <section id="view-einstellungen" class="view"></section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/github-sync.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/goods-icons-data.js"></script>
  <script src="js/islands.js"></script>
  <script src="js/map.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/warenketten.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
